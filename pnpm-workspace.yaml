packages:
  - 'packages/*'
  - 'tooling/*'

# pnpm 10 does not run dependency build scripts unless they are named here.
# esbuild needs its postinstall (it installs the platform binary Vite compiles with);
# core-js and tesseract.js only print notices, so they are refused.
allowBuilds:
  core-js: false
  esbuild: true
  tesseract.js: false
